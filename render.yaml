# Render Blueprint: single web service (API + built SPA) + managed Postgres.
# Deploy: push this repo to GitHub, then Render Dashboard -> New -> Blueprint,
# select the repo, confirm, and Render provisions everything below.
services:
  - type: web
    name: smart-energy-brain
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd ..
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: energy-brain-db
          property: connectionString

databases:
  - name: energy-brain-db
    databaseName: energybrain
    user: energybrain
    plan: free
