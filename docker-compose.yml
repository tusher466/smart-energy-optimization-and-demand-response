version: "3.9"
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /code
    volumes: ["./backend:/code"]
    env_file: .env
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    command: npm run dev -- --host --port 5173
    volumes: ["./frontend:/app"]
    depends_on: [backend]
